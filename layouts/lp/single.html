{{ define "main" }}
<div class="relative">
    <div class="absolute inset-0 z-[-1] bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_50%_50%_at_50%_0%,#000_70%,transparent_100%)]"></div>

    <section class="container mx-auto px-6 py-24 md:py-40 text-center">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-orange-500/20 bg-orange-500/10 text-orange-500 text-[10px] font-mono uppercase tracking-widest mb-8">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
            </span>
            {{ .Params.status_text | default "Available_for_Projects" }}
        </div>
        
        <h1 class="text-5xl md:text-8xl font-extrabold tracking-tighter mb-8 leading-[1.1]">
            <span class="text-gradient">{{ .Params.hero_title_white }}</span> 
            <br class="hidden md:block" />
            <span class="text-orange-500">{{ .Params.hero_title_orange }}</span>
        </h1>

        <a href="https://wa.me/{{ .Site.Params.whatsapp }}" class="animate-cta-orange px-10 py-4 bg-white text-black font-bold rounded-full hover:bg-orange-500 hover:text-white transition-all duration-300 uppercase text-xs tracking-widest">
            {{ .Params.cta_text | default "Start_Project" }}
        </a>
    </section>

    <section class="container mx-auto px-6 py-20 border-t border-neutral-900/30">
        <div class="prose prose-invert prose-orange max-w-none">
            {{ .Content }}
        </div>
    </section>
</div>
{{ end }}
