{{ define "extra_meta" }}
<meta name="robots" content="noindex, nofollow">
{{ end }}

{{ define "main" }}
<section class="container mx-auto px-6 py-24 max-w-4xl">
    <header class="mb-12 border-b border-neutral-900 pb-10">
        <span class="text-orange-500 font-mono text-[10px] uppercase tracking-[0.3em]">Directory_Listing</span>
        <h1 class="text-4xl font-bold text-white mt-2">Active_Landing_Pages</h1>
        <p class="text-neutral-500 font-mono text-xs mt-4">$ ls -la /content/lp/</p>
    </header>

    <div class="grid gap-4">
        {{ range .Pages }}
        <a href="{{ .Permalink }}" class="group flex items-center justify-between p-4 rounded-xl bg-neutral-900/50 border border-neutral-800 hover:border-orange-500/30 transition-all">
            <div class="flex flex-col">
                <span class="text-white font-bold group-hover:text-orange-500 transition-colors">{{ .Title }}</span>
                <span class="text-[10px] font-mono text-neutral-600 uppercase tracking-widest mt-1">
                    Slug: {{ .Slug | default .File.ContentBaseName }}
                </span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-mono text-neutral-700">{{ .Date.Format "2006-01-02" }}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-neutral-700 group-hover:text-orange-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </div>
        </a>
        {{ end }}
    </div>
</section>
{{ end }}
