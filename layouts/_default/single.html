{{ define "main" }}
<article class="container mx-auto px-6 py-20 max-w-3xl">
    <header class="mb-12 border-b border-neutral-900 pb-8">
        <h1 class="text-3xl md:text-5xl font-bold text-white">{{ .Title }}</h1>
        <div class="text-neutral-600 font-mono text-[10px] mt-4">
            $ date: {{ .Date.Format "2006-01-02" }}
        </div>
    </header>

    <div class="prose prose-invert prose-orange max-w-none leading-relaxed">
        {{ .Content }}
    </div>
</article>
{{ end }}
