<footer class="container mx-auto px-6 py-12 border-t border-neutral-900">
    <div class="flex flex-col items-center justify-center gap-8 text-center">
        
        <div class="flex flex-col items-center gap-2">
            <div class="flex items-center gap-3">
                <span class="text-white font-bold tracking-tighter">JULIO_STUDIO</span>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-neutral-900 text-orange-500 border border-orange-500/20">
                    {{ $.Site.Params.site_version }}
                </span>
            </div>
            <p class="text-[10px] font-mono text-neutral-600 uppercase tracking-widest">
                &copy; {{ now.Format "2006" }} <span class="text-neutral-400">Stable_Build</span>. Compiled_with_Hugo
            </p>
        </div>

        <div class="flex flex-col items-center gap-2">
            <div class="flex items-center gap-2">
                <div class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
                </div>
                <span class="text-[10px] font-mono text-emerald-400 font-bold uppercase tracking-[0.2em]">System_Operational</span>
            </div>
            <span class="text-[9px] font-mono text-neutral-700">$ uptime: up_since_2026</span>
        </div>

        <div class="flex flex-col items-center gap-1">
            <span class="text-[9px] font-mono text-neutral-600 uppercase tracking-widest">Traffic_Analysis</span>
            <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-neutral-900/50 border border-neutral-800 hover:border-neutral-700 transition-colors">
                <svg class="w-3 h-3 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                
                <img src="https://visitor-badge.laobi.icu/badge?page_id=juliostudio.dev.br&left_text=VISITS&left_color=171717&right_color=171717" 
                     alt="Visitas" 
                     class="h-3 opacity-90"
                     style="filter: invert(1) brightness(1.5);">
            </div>
        </div>

    </div>

    <div class="mt-12 flex justify-center">
        <div class="h-px w-24 bg-gradient-to-r from-transparent via-neutral-800 to-transparent"></div>
    </div>
</footer>
