<header class="glass sticky top-0 z-50 w-full border-b border-slate-800">
    <nav class="container mx-auto px-4 py-4 flex justify-between items-center relative">
        <a href="/" class="flex items-center gap-2 hover:opacity-90 transition shrink-0">
            <div class="font-mono font-black text-slate-700 text-xs tracking-tighter shrink-0 select-none">
                JS
            </div>
            <h1 class="text-sm md:text-xl font-mono font-black tracking-tighter uppercase whitespace-nowrap text-white">
                JULIO<span class="text-cyan-400">_STUDIO</span>
            </h1>
        </a>
        
        <div class="flex items-center gap-5 md:gap-6 ml-auto">
            
            <div class="relative group">
                <a href="#services-section" onclick="smoothScroll(event, 'services-section')" class="flex items-center gap-1 text-slate-300 hover:text-[#22D3EE] font-semibold transition-colors tracking-tight py-2" title="Serviços">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:hidden text-slate-500 group-hover:text-[#22D3EE] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span class="hidden md:inline text-sm">Serviços</span>
                </a>

                <div class="absolute right-0 top-full mt-1 w-52 bg-[#0b0f19]/95 backdrop-blur-md border border-slate-800 rounded-md p-2 shadow-2xl opacity-0 invisible translate-y-1 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 transition-all duration-200 z-50 font-mono text-xs">
                    <div class="px-2 py-1 text-[10px] text-slate-500 uppercase tracking-wider border-b border-slate-900 mb-1 font-sans">Selecionar Serviço:</div>
                    <a href="#card-webdev" onclick="highlightCard(event, 'card-webdev')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[01_WEB_DEV]</a>
                    <a href="#card-automation" onclick="highlightCard(event, 'card-automation')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[02_AUTOMATION]</a>
                    <a href="#card-traffic" onclick="highlightCard(event, 'card-traffic')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[03_TRAFFIC_ADS]</a>
                    <a href="#card-monetization" onclick="highlightCard(event, 'card-monetization')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[04_MONETIZATION]</a>
                    <a href="#tools-section" onclick="highlightCard(event, 'tools-section')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[05_PUBLIC_REPO]</a>
                    <a href="#portfolio-section" onclick="highlightCard(event, 'portfolio-section')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[06_PORTFOLIO]</a>
                </div>
            </div>

            <div class="relative group">
                <a href="#tools-section" onclick="smoothScroll(event, 'tools-section')" class="flex items-center gap-1 text-slate-300 hover:text-[#22D3EE] font-semibold transition-colors tracking-tight py-2" title="Ferramentas">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:hidden text-slate-500 group-hover:text-[#22D3EE] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 00-1 1v1a2 2 0 11-4 0v-1a1 1 0 00-1-1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
                    </svg>
                    <span class="hidden md:inline text-sm">Ferramentas</span>
                </a>

                <div class="absolute right-0 top-full mt-1 w-56 bg-[#0b0f19]/95 backdrop-blur-md border border-slate-800 rounded-md p-2 shadow-2xl opacity-0 invisible translate-y-1 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 transition-all duration-200 z-50 font-mono text-xs">
                    <div class="px-2 py-1 text-[10px] text-slate-500 uppercase tracking-wider border-b border-slate-900 mb-1 font-sans">Utilitários:</div>
                    <a href="https://github.com/bizumatica/backinbash-tools" target="_blank" rel="noopener noreferrer" class="block px-3 py-2 text-cyan-400 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors font-bold">> backinbash-tools ↗</a>
                </div>
            </div>

            <span class="hidden sm:inline px-3 py-1 rounded-full border border-slate-800 text-[10px] font-mono text-slate-400 uppercase tracking-widest bg-slate-900/80">
                {{ $.Site.Params.site_version }}
            </span>
        </div>
    </nav>
</header>

<script>
    function smoothScroll(e, targetId) {
        e.preventDefault();
        const target = document.getElementById(targetId);
        if (target) {
            window.scrollTo({
                top: target.offsetTop - 90, // Desconto da altura do header sticky
                behavior: 'smooth'
            });
        }
    }

    function highlightCard(e, cardId) {
        e.preventDefault();
        const card = document.getElementById(cardId);
        if (card) {
            // Rola suavemente até o elemento com offset do Header
            window.scrollTo({
                top: card.getBoundingClientRect().top + window.scrollY - 110,
                behavior: 'smooth'
            });

            // Remove classes antigas caso o usuário clique múltiplas vezes
            card.classList.remove('ring-2', 'ring-cyan-400', 'shadow-[0_0_25px_rgba(34,211,238,0.4)]', 'transition-all', 'duration-500');
            
            // Injeta o efeito hacker/brutalista elegante de brilho ciano
            setTimeout(() => {
                card.classList.add('transition-all', 'duration-500', 'ring-2', 'ring-cyan-400', 'shadow-[0_0_25px_rgba(34,211,238,0.4)]');
            }, 100);

            // Remove suavemente após 2.5 segundos para não poluir a tela permanentemente
            setTimeout(() => {
                card.classList.remove('ring-2', 'ring-cyan-400', 'shadow-[0_0_25px_rgba(34,211,238,0.4)]');
            }, 2500);
        }
    }
</script>
