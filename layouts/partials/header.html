<header class="glass sticky top-0 z-50 w-full overflow-hidden">
    <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/" class="flex items-center gap-1.5 md:gap-2 hover:opacity-90 transition shrink-0">

                JS
            </div>
            <h1 class="text-[12px] md:text-xl font-bold tracking-tighter uppercase whitespace-nowrap">
                JULIO<span class="text-orange-500">_STUDIO</span>

        </a>
        
        <div class="flex items-center gap-4 md:gap-6 ml-auto">
            
            <a href="#landing-pages" class="text-neutral-400 hover:text-white transition-colors flex items-center gap-1" title="Serviços">

                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:hidden text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                Blog
            </a>

            <div class="flex items-center border-l border-neutral-800 pl-3 md:pl-0 md:border-none">
                {{ partial "search.html" . }}
            </div>

            <span class="hidden lg:inline px-3 py-1 rounded-full border border-neutral-800 text-[10px] font-mono text-neutral-500 uppercase tracking-widest bg-neutral-900/50">
                {{ $.Site.Params.site_version }}
