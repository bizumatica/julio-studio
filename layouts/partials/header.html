<header class="glass sticky top-0 z-50 w-full border-b border-slate-800 bg-[#0b0f19]/80 backdrop-blur-md">
    <nav class="container mx-auto px-4 py-4 flex justify-between items-center relative">
        <a href="/" class="flex items-center gap-2 hover:opacity-90 transition shrink-0">
            <div class="font-mono font-black text-slate-700 text-xs tracking-tighter shrink-0 select-none">
                JS
            </div>
            <h1 class="text-sm md:text-xl font-mono font-black tracking-tighter uppercase whitespace-nowrap text-white">
                JULIO<span class="text-cyan-400">_STUDIO</span>
            </h1>
        </a>
        
        <div class="flex items-center gap-5 md:gap-6 ml-auto">
            
            <div class="relative">
                <a href="/#services-section" onclick="handleDropdownTrigger(event, 'services-section', 'dropdown-services')" class="flex items-center gap-1 text-slate-300 hover:text-[#22D3EE] font-semibold transition-colors tracking-tight py-2 select-none cursor-pointer" title="Serviços">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:hidden text-slate-500 trigger-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span class="hidden md:inline text-sm">Serviços</span>
                    <span class="text-[9px] text-slate-600 transition-transform duration-200">▼</span>
                </a>

                <div id="dropdown-services" class="js-dropdown absolute right-0 top-full mt-1 w-52 bg-[#0b0f19]/95 backdrop-blur-md border border-slate-800 rounded-md p-2 shadow-2xl opacity-0 invisible translate-y-1 transition-all duration-200 z-50 font-mono text-xs">
                    <div class="px-2 py-1 text-[10px] text-slate-500 uppercase tracking-wider border-b border-slate-900 mb-1 font-sans">Selecionar Serviço:</div>
                    <a href="/#card-webdev" onclick="highlightCard(event, 'card-webdev')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[01_WEB_DEV]</a>
                    <a href="/#card-automation" onclick="highlightCard(event, 'card-automation')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[02_AUTOMATION]</a>
                    <a href="/#card-traffic" onclick="highlightCard(event, 'card-traffic')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[03_TRAFFIC_ADS]</a>
                    <a href="/#card-monetization" onclick="highlightCard(event, 'card-monetization')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[04_MONETIZATION]</a>
                    <a href="/#card-tool" onclick="highlightCard(event, 'card-tool')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[05_PUBLIC_REPO]</a>
                    <a href="/#card-portfolio" onclick="highlightCard(event, 'card-portfolio')" class="block px-3 py-2 text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors">[06_PORTFOLIO]</a>
                </div>
            </div>

            <div class="relative">
                <a href="/#card-tool" onclick="handleDropdownTrigger(event, 'card-tool', 'dropdown-tools')" class="flex items-center gap-1 text-slate-300 hover:text-[#22D3EE] font-semibold transition-colors tracking-tight py-2 select-none cursor-pointer" title="Ferramentas">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:hidden text-slate-500 trigger-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 00-1 1v1a2 2 0 11-4 0v-1a1 1 0 00-1-1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
                    </svg>
                    <span class="hidden md:inline text-sm">Ferramentas</span>
                    <span class="text-[9px] text-slate-600 transition-transform duration-200">▼</span>
                </a>

                <div id="dropdown-tools" class="js-dropdown absolute right-0 top-full mt-1 w-56 bg-[#0b0f19]/95 backdrop-blur-md border border-slate-800 rounded-md p-2 shadow-2xl opacity-0 invisible translate-y-1 transition-all duration-200 z-50 font-mono text-xs">
                    <div class="px-2 py-1 text-[10px] text-slate-500 uppercase tracking-wider border-b border-slate-900 mb-1 font-sans">Utilitários:</div>
                    <a href="https://github.com/bizumatica/backinbash-tools" target="_blank" rel="noopener noreferrer" class="block px-3 py-2 text-cyan-400 hover:text-cyan-400 hover:bg-slate-900/60 rounded transition-colors font-bold">> backinbash-tools ↗</a>
                </div>
            </div>

            <span class="hidden sm:inline px-3 py-1 rounded-full border border-slate-800 text-[10px] font-mono text-slate-400 uppercase tracking-widest bg-slate-900/80">
                {{ $.Site.Params.site_version }}
            </span>
        </div>
    </nav>
</header>

<script>
    let dropdownTimeouts = {};

    // Força o fechamento de todos os dropdowns ativos e limpa temporizadores
    function closeAllDropdowns() {
        document.querySelectorAll('.js-dropdown').forEach(menu => {
            menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
            menu.classList.add('opacity-0', 'invisible', 'translate-y-1');
            const arrow = menu.parentElement.querySelector('span:last-child');
            if(arrow) arrow.classList.remove('rotate-180');
        });
        for (let key in dropdownTimeouts) {
            clearTimeout(dropdownTimeouts[key]);
            delete dropdownTimeouts[key];
        }
    }

    // Função central para aplicar o efeito brutalista de pulso ciano
    function triggerGlow(card) {
        card.classList.remove('ring-2', 'ring-cyan-400', 'shadow-[0_0_25px_rgba(34,211,238,0.4)]');
        setTimeout(() => {
            card.classList.add('transition-all', 'duration-500', 'ring-2', 'ring-cyan-400', 'shadow-[0_0_25px_rgba(34,211,238,0.4)]');
        }, 100);

        setTimeout(() => {
            card.classList.remove('ring-2', 'ring-cyan-400', 'shadow-[0_0_25px_rgba(34,211,238,0.4)]');
        }, 2500);
    }

    // Gerencia o clique nos cabeçalhos principais do menu
    function handleDropdownTrigger(e, sectionId, dropdownId) {
        const targetSection = document.getElementById(sectionId);
        const menu = document.getElementById(dropdownId);
        
        // Se o elemento existe na página atual (Estamos na Home)
        if (targetSection && menu) {
            e.preventDefault();
            
            // Rola até a seção correspondente
            window.scrollTo({
                top: targetSection.offsetTop - 90,
                behavior: 'smooth'
            });

            // Se o ID de destino for de um Card específico (ex: card-tool), força o brilho!
            if (sectionId.startsWith('card-')) {
                triggerGlow(targetSection);
            }
            
            const isOpen = menu.classList.contains('opacity-100');
            
            // Reseta estados globais antes de alternar
            closeAllDropdowns();
            
            if (!isOpen) {
                // Abre o menu clicado
                menu.classList.remove('opacity-0', 'invisible', 'translate-y-1');
                menu.classList.add('opacity-100', 'visible', 'translate-y-0');
                
                const arrow = menu.parentElement.querySelector('span:last-child');
                if(arrow) arrow.classList.add('rotate-180');

                // Configura o timeout rígido de expiração (5000ms = 5 segundos)
                dropdownTimeouts[dropdownId] = setTimeout(() => {
                    menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
                    menu.classList.add('opacity-0', 'invisible', 'translate-y-1');
                    if(arrow) arrow.classList.remove('rotate-180');
                    delete dropdownTimeouts[dropdownId];
                }, 5000);
            }
        } 
        // Se NÃO existe (estamos em páginas como /termos-de-uso), o navegador prossegue nativamente
        // redirecionando o usuário para o endereço absoluto configurado na âncora.
    }

    // Manipula o clique nos itens internos dos Dropdowns
    function highlightCard(e, cardId) {
        const card = document.getElementById(cardId);
        
        if (card) {
            e.preventDefault();
            closeAllDropdowns();

            window.scrollTo({
                top: card.getBoundingClientRect().top + window.scrollY - 110,
                behavior: 'smooth'
            });

            // Aplica a animação via função centralizada
            triggerGlow(card);
        }
    }

    // Evento global para fechar os menus ao clicar fora da área do cabeçalho
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.relative')) {
            closeAllDropdowns();
        }
    });

    // SISTEMA AUTÔNOMO CROSS-PAGE: Se o usuário vier de outra página carregando um Hash na URL,
    // intercepta a inicialização do DOM, rola suavemente até o container e executa o highlight técnico.
    window.addEventListener('DOMContentLoaded', () => {
        const currentHash = window.location.hash.replace('#', '');
        if (currentHash) {
            setTimeout(() => {
                highlightCard({ preventDefault: () => {} }, currentHash);
            }, 400); // Delay cirúrgico para estabilização do layout móvel/desktop
        }
    });
</script>
