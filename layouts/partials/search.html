<button id="search-button" class="p-1.5 text-neutral-500 hover:text-orange-500 transition-colors flex items-center group">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <span class="hidden md:inline ml-2 font-mono text-[10px] uppercase tracking-tighter group-hover:translate-x-0.5 transition-transform">grep</span>
</button>

<div id="search-modal" class="fixed inset-0 z-[100] hidden bg-black/90 backdrop-blur-md p-4 md:p-20">
    <div class="max-w-3xl mx-auto bg-[#0a0a0a] border border-neutral-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        <div class="p-4 border-b border-neutral-900 flex justify-between items-center bg-neutral-900/20">
            <span class="font-mono text-[10px] text-orange-500 uppercase tracking-widest">search_engine.sh</span>
            <button id="close-search" class="text-neutral-500 hover:text-white font-mono text-[10px] uppercase transition-colors">[ ESC ]</button>
        </div>
        
        <div id="search-ui" class="p-4 min-h-[300px] max-h-[70vh] overflow-y-auto no-scrollbar"></div>
    </div>
</div>

<link href="/_pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/_pagefind/pagefind-ui.js"></script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('search-modal');
        const btn = document.getElementById('search-button');
        const close = document.getElementById('close-search');

        // Inicializa o Pagefind UI
        const pagefind = new PagefindUI({ 
            element: "#search-ui", 
            showImages: false,
            translations: {
                placeholder: "Digite para buscar..."
            }
        });

        const openSearch = () => {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                // Seleciona o input criado pelo Pagefind e foca nele
                const input = document.querySelector('.pagefind-ui__search-input');
                if (input) input.focus();
            }, 100);
        };

        const closeSearch = () => {
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        };

        btn.addEventListener('click', openSearch);
        close.addEventListener('click', closeSearch);

        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && modal.classList.contains('hidden')) {
                // Se não houver outros inputs focados, abre a busca
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    openSearch();
                }
            }
            if (e.key === 'Escape') closeSearch();
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeSearch();
        });
    });
</script>
