<button id="search-button" class="p-1.5 text-neutral-500 hover:text-orange-500 transition-colors flex items-center">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <span class="hidden md:inline ml-2 font-mono text-[10px] uppercase">grep</span>
</button>

<div id="search-modal" class="fixed inset-0 z-[100] hidden bg-black/80 backdrop-blur-sm p-4 md:p-20">
    <div class="max-w-3xl mx-auto bg-neutral-950 border border-neutral-800 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-4 border-b border-neutral-900 flex justify-between items-center bg-neutral-900/20">
            <span class="font-mono text-xs text-orange-500">search_engine.sh</span>
            <button id="close-search" class="text-neutral-500 hover:text-white font-mono text-xs">[ ESC ]</button>
        </div>
        <div id="search-ui" class="p-4 min-h-[300px] max-h-[70vh] overflow-y-auto">
            </div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        // Inicializa o Pagefind
        new PagefindUI({ 
            element: "#search-ui", 
            showSubResults: true,
            resetFilters: false,
            translations: {
                placeholder: "Procurar no blog...",
                clear_search: "Limpar",
                load_more: "Ver mais resultados",
                search_label: "Procurar",
                filters_label: "Filtros",
                zero_results: "Nenhum resultado encontrado para [ [query] ]",
                many_results: "[count] resultados encontrados",
                one_result: "1 resultado encontrado",
                alt_search: "Não foram encontrados resultados para [query]. A mostrar resultados para [alt]."
            }
        });

        const modal = document.getElementById('search-modal');
        const btn = document.getElementById('search-button');
        const close = document.getElementById('close-search');

        const openSearch = () => {
            modal.classList.remove('hidden');
            // Pequeno delay para garantir que o DOM do Pagefind esteja pronto para o focus
            setTimeout(() => {
                const input = document.querySelector('.pagefind-ui__search-input');
                if (input) input.focus();
            }, 100);
};

        btn.addEventListener('click', openSearch);
        close.addEventListener('click', () => modal.classList.add('hidden'));

        // Teclas de atalho
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && !modal.classList.contains('hidden')) return;
            if (e.key === '/') {
                e.preventDefault();
                openSearch();
            }
            if (e.key === 'Escape') modal.classList.add('hidden');
        });
    });
</script>
