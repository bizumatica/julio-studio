<div class="my-6 p-4 bg-neutral-900/30 border border-neutral-800 rounded-lg shadow-sm">
    {{ if .Get "title" }}
        <div class="text-xs font-mono text-neutral-500 uppercase mb-2 tracking-widest border-b border-neutral-800 pb-1">
            {{ .Get "title" }}
        </div>
    {{ end }}
    <div class="text-sm text-neutral-300 leading-relaxed">
        {{ .Inner | markdownify }}
    </div>
</div>
