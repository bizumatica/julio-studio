name: Deploy Hugo with Pagefind

on:
  push:
    branches: [main] # Dispara sempre que você der push na main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Garante que temas em submodulos sejam baixados
          fetch-depth: 0         # Necessário para o Hugo ler datas de commits

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true         # Necessário para a maioria dos temas modernos

      - name: Build and Index
        # 1. Gera o site na pasta /public
        # 2. npx pagefind cria o índice de busca dentro de /public/_pagefind
        run: |
          hugo --gc --minify --baseURL "https://juliostudio.dev.br/"
          npx pagefind --site public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: juliostudio.dev.br  # <--- Mantém o domínio vivo e evita erro 404
          publish_branch: gh-pages   # Branch onde os arquivos prontos residirão