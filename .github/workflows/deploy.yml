name: Pipeline de Deploy Julio Studio (Nativo Ultra-Fast)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões estritas exigidas pelo novo GitHub Pages nativo
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que não haja dois deploys atropelando um ao outro
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Checkout do Código-Fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1 # Máxima velocidade: clone raso (sem histórico pesado)

      - name: 🛠️ Configurar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest' # Puxa sempre o core atualizado e estável
          extended: true

      - name: 🏗️ Compilar Site Estático
        run: hugo --gc --minify --cleanDestinationDir --baseURL "https://juliostudio.dev.br/"

      - name: ⚙️ Compliance Check Ads & SEO
        run: |
          if [ ! -f "public/ads.txt" ]; then 
            echo "::warning::Aviso: ads.txt não detectado. Ignore se ainda não configurou o AdSense."
          fi

      # Deploy nativo moderno através de APIs oficiais do GitHub (Zero lixo no repositório)
      - name: 📦 Upload do Artefato (GitHub Pages Nativo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 🚀 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4