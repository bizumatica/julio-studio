baseURL = 'https://juliostudio.dev.br/'
languageCode = 'pt-BR'
title = 'Julio-Studio | Design & Performance'
canonifyURLs = true
relativeURLs = false

# Desabilita taxonomias e desnecessários para um site institucional/landing single puro, eliminando lixo no build
disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[params]
    description = "Design, Performance Web e Automatização"
    images = ["images/card.jpg"]
    site_version = "V2.0.0"
    
    # Links das Redes Sociais e Repositórios
    whatsapp = "5511964881236"
    github = "https://github.com/bizumatica"
    gitlab = "https://gitlab.com/BackInBash"
    linkedin = "https://www.linkedin.com/in/julio-prata/"

    # Exemplos de Landing Pages
    landing_page_examples = [
        { name = "Bizumática", url = "https://bizumatica.com.br/" },
        { name = "JulioStudio", url = "https://juliostudio.dev.br/" },
        { name = "Lar Espírita Cristão", url = "https://lecitatiba.com.br/" }
    ]

[languages]
  [languages.pt-br]
    contentDir = "content"
    languageName = "Português"
    weight = 1

# Configurações de renderização de Markdown e Shortcodes
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Essencial para os shortcodes renderizarem HTML puro
    [markup.goldmark.extensions]
      typographer = true

# Ajustado para máxima precisão no GitHub Actions (Remove dependência do histórico profundo do Git)
[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", "date", "publishDate"]

[imaging]
  anchor = 'smart'

# Otimizado para CI/CD: Sem rascunhos e permitindo o gerenciamento inteligente de recursos do pipeline
[build]
  renderDrafts = false